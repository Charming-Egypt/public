# Discover Sharm — translation Worker (Cloudflare Workers AI)
#   cd workers && npx wrangler deploy -c wrangler.translate.toml
# Variables to add in the dashboard: SUPABASE_URL, SUPABASE_ANON_KEY, ALLOWED_ORIGINS. No secrets: it uses the Workers AI binding below. (Workers AI has a free daily allowance; check Cloudflare pricing for your volume.)
name = "discover-sharm-translate"
main = "translate-worker.js"
compatibility_date = "2026-01-01"
keep_vars = true   # variables live in the Cloudflare dashboard: Workers & Pages → discover-sharm-translate → Settings → Variables and Secrets (see VARIABLES.md)

# Optional custom domain → put https://translate.discover-sharm.com as the DS_TRANSLATE_BASE variable on the admin Cloudflare Pages project
# routes = [{ pattern = "translate.discover-sharm.com/*", zone_name = "discover-sharm.com" }]

[ai]
binding = "AI"
