# Discover Sharm — settings Worker: the only way in or out of api/settings/settings.json in the private GitHub data repo
#   cd workers
#   npx wrangler secret put GITHUB_TOKEN -c wrangler.settings.toml      # the same fine-grained token as the content Worker (data repo only, Contents: Read and write)
#   npx wrangler deploy -c wrangler.settings.toml
# Custom domain (recommended): Workers & Pages → discover-sharm-settings → Settings → Domains & Routes → settings.discover-sharm.com
#   → then DS_SETTINGS_BASE = https://settings.discover-sharm.com on the www, app and admin Pages projects.
name = "discover-sharm-settings"
main = "settings-worker.js"
compatibility_date = "2026-01-01"
keep_vars = true

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR-ANON-KEY"
GITHUB_REPO = "YOUR-ORG/discover-sharm-data"
GITHUB_BRANCH = "main"
ALLOWED_ORIGINS = "https://admin.discover-sharm.com"
