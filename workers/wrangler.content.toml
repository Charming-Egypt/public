# Discover Sharm — content Worker (reads/writes the PRIVATE GitHub data repo; see content-worker.js)
#   cd workers
#   npx wrangler secret put GITHUB_TOKEN               -c wrangler.content.toml   # fine-grained token: ONLY the data repo, permission "Contents: Read and write"
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY  -c wrangler.content.toml
#   npx wrangler deploy -c wrangler.content.toml
# Custom domain (recommended): Cloudflare → Workers & Pages → discover-sharm-content → Settings → Domains & Routes → content.discover-sharm.com
#   → then set DS_CONTENT_BASE = https://content.discover-sharm.com on the www, app and admin Pages projects.
name = "discover-sharm-content"
main = "content-worker.js"
compatibility_date = "2026-01-01"
keep_vars = true   # variables live in the Cloudflare dashboard (Settings → Variables and Secrets); see VARIABLES.md

# [vars] intentionally NOT in this file: wrangler deploy would overwrite the real values set in the Cloudflare dashboard with placeholders.
# Set these in Cloudflare → Workers & Pages → discover-sharm-content → Settings → Variables and Secrets (see VARIABLES.md):
#   SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
#   SUPABASE_ANON_KEY = "YOUR-ANON-KEY"
#   GITHUB_REPO = "YOUR-ORG/discover-sharm-data"
#   GITHUB_BRANCH = "main"
#   MEDIA_BASE = "https://media.discover-sharm.com"
#   ALLOWED_ORIGINS = "https://www.discover-sharm.com,https://app.discover-sharm.com,https://admin.discover-sharm.com,https://owner.discover-sharm.com,https://seller.discover-sharm.com"

# Static hosting: one R2 bucket shared by the content + settings Workers.
#   npx wrangler r2 bucket create discover-sharm-media
#   Cloudflare → R2 → discover-sharm-media → Settings → Custom Domains → media.discover-sharm.com   (public, served by the CDN: no Worker involved)
#   Optional: Rules → Cache Rules → "media.discover-sharm.com / path starts with /catalog or /settings → Eligible for cache, Edge TTL: respect origin"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "discover-sharm-media"

# Every 5 minutes: refresh the static catalog (live star ratings) and copy any photo that is in GitHub but not in the bucket yet.
[triggers]
crons = ["*/5 * * * *"]
