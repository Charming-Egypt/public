# Discover Sharm — payments Worker (Supabase edition)
#   cd workers && npx wrangler deploy -c wrangler.payments.toml
#
# SECRETS (never commit them — `npx wrangler secret put NAME -c wrangler.payments.toml`):
#   SUPABASE_SERVICE_ROLE_KEY   Supabase → Project Settings → API → service_role   (lets this Worker confirm payments)
#   KASHIER_API_KEY             Kashier dashboard
#   KASHIER_SECRET_KEY          Kashier dashboard (webhook signature)
#   RESEND_API_KEY              resend.com (confirmation e-mails; optional)
name = "discover-sharm-payments"
main = "payments-worker.js"
compatibility_date = "2026-01-01"

# Serve it on your own domain, e.g. pay.discover-sharm.com  (then put https://pay.discover-sharm.com in site.config.json → supabase.paymentsBase)
# routes = [{ pattern = "pay.discover-sharm.com/*", zone_name = "discover-sharm.com" }]

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY"
KASHIER_MERCHANT_ID = "MID-XXXX"
KASHIER_MODE = "live"                 # "test" while you try it
KASHIER_CURRENCY = "EGP"
SITE_URL = "https://app.discover-sharm.com"
MAIL_FROM = "Discover Sharm <bookings@discover-sharm.com>"

# Optional but recommended: a shared rate limit across Cloudflare locations
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "…"
