# Discover Sharm — payments Worker (Supabase edition)
#   cd workers && npx wrangler deploy -c wrangler.payments.toml
#
# ALL variables and secrets are set in the Cloudflare dashboard: Workers & Pages → discover-sharm-payments → Settings → Variables and Secrets
# (full list with where each value comes from: VARIABLES.md). Secrets (type "Secret"):
#   SUPABASE_SERVICE_ROLE_KEY   Supabase → Project Settings → API → service_role   (lets this Worker confirm payments)
#   KASHIER_API_KEY             Kashier dashboard
#   KASHIER_SECRET_KEY          Kashier dashboard (webhook signature)
#   RESEND_API_KEY              resend.com (confirmation e-mails; optional)
name = "discover-sharm-payments"
main = "payments-worker.js"
compatibility_date = "2026-01-01"

# Serve it on your own domain, e.g. pay.discover-sharm.com  (then put https://pay.discover-sharm.com as the DS_PAYMENTS_BASE variable on the www + app Cloudflare Pages projects)
# routes = [{ pattern = "pay.discover-sharm.com/*", zone_name = "discover-sharm.com" }]

keep_vars = true   # variables/secrets live in the Cloudflare dashboard (see VARIABLES.md); a deploy must not wipe them

# Optional but recommended: a shared rate limit across Cloudflare locations
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "…"
