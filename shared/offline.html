<!DOCTYPE html>
<html lang="en" dir="ltr"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" /><title>Offline — Discover Sharm</title>
<style>
  :root{--bg:#f6f5f3;--card:#fff;--text:#16171b;--muted:#6d6f77;--line:rgba(22,23,27,.08)}
  html[data-theme=dark]{--bg:#0d0d0f;--card:#171719;--text:#f5f5f6;--muted:#a9abb3;--line:rgba(255,255,255,.09)}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  .card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:32px;padding:36px 26px;box-shadow:0 24px 50px -30px rgba(0,0,0,.4)}
  .ic{width:92px;height:92px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fb923c,#f97316 55%,#ea580c);box-shadow:0 14px 28px -12px rgba(249,115,22,.6)}
  .ic svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--muted);line-height:1.7;font-size:.95rem;margin-bottom:26px}
  button{width:100%;height:54px;border:0;border-radius:999px;cursor:pointer;color:#fff;font:800 1rem Inter,system-ui,sans-serif;background:linear-gradient(135deg,#fb923c,#f97316 55%,#ea580c);box-shadow:0 14px 28px -12px rgba(249,115,22,.6)}
</style>
<script>
  (function(){try{var d=document.documentElement;d.dataset.theme=localStorage.getItem('ds_theme')||'dark';
    var T={en:['You are offline','Check your connection — pages you opened before are still available.','Try again'],
      ar:['أنت غير متصل بالإنترنت','تأكد من اتصالك بالشبكة — الصفحات التي فتحتها من قبل ما زالت متاحة.','حاول مرة أخرى'],
      ru:['Нет подключения','Проверьте соединение — ранее открытые страницы доступны.','Повторить'],
      de:['Du bist offline','Prüfe deine Verbindung – bereits geöffnete Seiten sind weiterhin verfügbar.','Erneut versuchen'],
      it:['Sei offline','Controlla la connessione: le pagine già aperte restano disponibili.','Riprova'],
      tr:['Çevrimdışısınız','Bağlantınızı kontrol edin — daha önce açtığınız sayfalar kullanılabilir.','Tekrar dene']};
    var l=localStorage.getItem('ds_lang')||'en';if(!T[l])l='en';d.lang=l;d.dir=l==='ar'?'rtl':'ltr';
    document.addEventListener('DOMContentLoaded',function(){var e=document.querySelectorAll('[data-k]');for(var i=0;i<e.length;i++)e[i].textContent=T[l][e[i].dataset.k];});
    window.addEventListener('online',function(){location.reload();});
  }catch(e){}})();
</script></head>
<body><main class="card">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.2a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".6"/><path d="M3 3l18 18"/></svg></div>
  <h1 data-k="0">You are offline</h1>
  <p data-k="1">Check your connection — pages you opened before are still available.</p>
  <button type="button" onclick="location.reload()" data-k="2">Try again</button>
</main></body></html>
