<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<script src="/ds-bridge.js"></script>
<title>Check your booking — Discover Sharm</title>
<style>
  :root { --ink:#111; --muted:#666; --line:#e5e5e5; --brand:#c2410c; --ok:#166534; --bad:#991b1b; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f4f5; color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:14px; }
  h1 { margin:6px 0 0; font-size:20px; color:var(--brand); }
  .st { display:inline-block; padding:4px 14px; border-radius:99px; font-weight:700; font-size:13px; background:#dcfce7; color:var(--ok); }
  .st.off { background:#fee2e2; color:var(--bad); } .st.wait { background:#fef3c7; color:#92400e; }
  .row { display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--line); } .row b { text-align:end; }
  .big { background:#fff7ed; border:1px solid #fed7aa; border-radius:12px; padding:12px 14px; margin-top:14px; line-height:1.8; }
  label { display:block; font-weight:700; margin:12px 0 4px; font-size:13px; }
  input,textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; } textarea { min-height:90px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px 22px; font-weight:700; font-size:15px; cursor:pointer; margin-top:12px; } button:disabled { opacity:.5; }
  .muted { color:var(--muted); font-size:13px; } #msg { margin-top:10px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Check your booking · تحقق من حجزك</h1>
  <div class="muted">Discover Sharm</div>
  <div class="card" id="box">Loading… · جارٍ التحميل</div>
  <div class="card" id="rep" hidden>
    <b>Did someone ask you for more money? · حد طلب منك فلوس زيادة؟</b>
    <div class="muted">Tell us — we hold the seller's commission on this booking and review it. · قولنا وهنوقف عمولة السيلر على الحجز ده ونراجعه.</div>
    <label for="ct">Your phone or e-mail · رقمك أو إيميلك</label><input id="ct" autocomplete="tel">
    <label for="rs">What happened · اللي حصل</label><textarea id="rs"></textarea>
    <button id="go" type="button">Send report · إرسال البلاغ</button><div id="msg"></div>
  </div>
</div>
<script>window.DS_SUPABASE = {{SUPABASE_CONFIG}};</script>
<script src="{{SUPABASE_JS}}"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), box = $('#box');
  const cfg = window.DS_SUPABASE, id = new URLSearchParams(location.search).get('id');
  const say = (t) => { box.textContent = t; };
  if (!cfg || !window.supabase || !id) return say('Booking not found · الحجز غير موجود');
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  const { data: b } = await sb.rpc('public_booking_check', { p_id: id });
  if (!b) return say('Booking not found · الحجز غير موجود');
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
  const money = (n) => `${Number(n).toLocaleString('en')} ${b.currency || 'EGP'}`;
  const S = { confirmed: ['CONFIRMED · مؤكد', ''], unpaid: ['NOT PAID YET · لم يُدفع بعد', 'wait'] }[b.status] || [String(b.status).toUpperCase(), 'off'];
  box.textContent = '';
  box.append(el('span', 'st ' + S[1], S[0]));
  const row = (k, v) => { if (v === undefined || v === null || v === '') return; const r = el('div', 'row'); r.append(el('span', '', k), el('b', '', v)); box.append(r); };
  row('Reference · رقم الحجز', b.id); row('Service · الخدمة', b.item); row('Date · التاريخ', b.checkout ? `${b.date} → ${b.checkout}` : b.date);
  row('Customer · العميل', b.customer); row('E-mail · الإيميل', b.email); row('Total · الإجمالي', money(b.total));
  row('Paid online to Discover Sharm · المدفوع أونلاين لديسكفر شرم', money(b.paidOnline));
  if (b.status === 'confirmed') row('Left to pay at the service · المتبقي في مكان الخدمة', money(b.payOnSite));
  const note = el('div', 'big');
  if (b.status === 'confirmed') note.textContent = Number(b.payOnSite) > 0
    ? `You should have paid ${money(b.paidOnline)} in total before the service, and only ${money(b.payOnSite)} more, to the service provider at the service. Anything more is not part of this booking. · المفروض تكون دفعت ${money(b.paidOnline)} قبل الخدمة، والمتبقي ${money(b.payOnSite)} بس بتدفعه لمقدّم الخدمة في المكان. أي مبلغ زيادة مش من الحجز ده.`
    : `This booking is fully paid. Nothing else is due. · الحجز مدفوع بالكامل. مفيش أي مبالغ تانية.`;
  else note.textContent = 'This booking is not confirmed by Discover Sharm. If you already paid someone for it, report it below. · الحجز ده غير مؤكد من ديسكفر شرم. لو دفعت لحد فلوس عليه، بلّغ تحت.';
  box.append(note);
  $('#rep').hidden = false;
  $('#go').onclick = async () => {
    const msg = $('#msg'), btn = $('#go'); btn.disabled = true; msg.textContent = '';
    const { error } = await sb.rpc('report_seller', { p_booking: id, p_contact: $('#ct').value.trim(), p_reason: $('#rs').value.trim() });
    if (error) { msg.textContent = 'Please fill both fields (5+ characters). · اكتب بياناتك والتفاصيل.'; btn.disabled = false; return; }
    msg.textContent = 'Thank you — we received your report. · شكراً، استلمنا بلاغك.';
  };
})();
</script>
</body>
</html>
