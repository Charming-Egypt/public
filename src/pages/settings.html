    <div id="settingsPage" class="page">
      <div class="min-h-screen pb-28">
        <div class="px-5 pt-6 pb-4 flex items-center gap-3 header-light">
          <button type="button" aria-label="Back" data-i18n-aria="ariaBack" data-back onclick="nav.go('profile')" class="w-11 h-11 field-box rounded-xl flex items-center justify-center" style="color:var(--text-primary)"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
          <div><p class="section-subtitle" data-i18n="preferencesEyebrow">— PREFERENCES</p><h1 class="text-xl font-bold font-display" style="color:var(--text-primary)" data-i18n="settingsTitle">Settings</h1></div>
        </div>
        <div class="px-5 py-6 space-y-4">
          <div class="card rounded-2xl p-4 space-y-5">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-3"><div class="w-10 h-10 bg-gold-400/15 rounded-xl flex items-center justify-center"><i class="fa-solid fa-coins text-gold-500" aria-hidden="true"></i></div><span class="text-sm font-medium" style="color:var(--text-primary)" data-i18n="currency">Currency</span></div>
              <select id="currencySelect" onchange="changeCurrency(this.value)" class="rounded-xl px-3 py-2 text-sm outline-none"><option value="EGP">EGP (ج.م)</option></select>
            </div>
            <p id="currencyAvailabilityNote" class="text-[11px] hidden" style="color:var(--text-secondary)" data-i18n="currencyEgpOnly">Showing EGP — live rates unavailable</p>
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-3"><div class="w-10 h-10 bg-violet-50 rounded-xl flex items-center justify-center"><i class="fa-solid fa-globe text-violet-600" aria-hidden="true"></i></div><span class="text-sm font-medium" style="color:var(--text-primary)" data-i18n="language">Language</span></div>
              <select onchange="I18N.set(this.value)" class="lang-select rounded-xl px-3 py-2 text-sm outline-none" style="background:var(--bg-field); color:var(--text-primary); border:1px solid var(--border-field)">
                <option value="en">English</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="tr">Türkçe</option>
              </select>
            </div>
            <div id="pwaPushRow" class="hidden">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--bg-field)"><i class="fa-solid fa-bell text-gold-500" aria-hidden="true"></i></div><span class="text-sm font-medium" style="color:var(--text-primary)" data-i18n="pwaPushTitle">Notifications</span></div>
                <button type="button" onclick="window.PWA && PWA.togglePush()" class="btn-gold px-4 py-2 rounded-xl text-sm font-bold" data-i18n="pwaPushOn">Turn on</button>
              </div>
              <p class="pwa-push-note hidden text-[11px] mt-2" style="color:var(--text-secondary)"></p>
            </div>
            <div id="pwaInstallRow" class="hidden flex justify-between items-center">
              <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--bg-field)"><i class="fa-solid fa-mobile-screen-button text-violet-600" aria-hidden="true"></i></div><span class="text-sm font-medium" style="color:var(--text-primary)" data-i18n="pwaSettingsInstall">Install the app</span></div>
              <button type="button" onclick="window.PWA && PWA.install()" class="btn-gold px-4 py-2 rounded-xl text-sm font-bold" data-i18n="pwaInstallBtn">Install</button>
            </div>
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--bg-field)"><i class="fa-solid fa-moon text-violet-500" aria-hidden="true"></i></div><span class="text-sm font-medium" style="color:var(--text-primary)" data-i18n="darkMode">Dark Mode</span></div>
              <div class="theme-switch" id="themeSwitchSettings" onclick="THEME.toggle()"><div class="knob"><i class="fa-solid fa-moon" aria-hidden="true" style="font-size:9px;color:#0a0a0a"></i></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
