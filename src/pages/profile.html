    <div id="profilePage" class="page">
      <div class="min-h-screen pb-28">
        <div class="px-5 pt-6 pb-4 flex items-center gap-3 header-light">
          <button type="button" aria-label="Back" data-i18n-aria="ariaBack" data-back onclick="nav.go('home')" class="w-11 h-11 field-box rounded-xl flex items-center justify-center" style="color:var(--text-primary)"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
          <div><h1 class="text-xl font-bold font-display" style="color:var(--text-primary)" data-i18n="profileTitle">Profile</h1></div>
        </div>
        <div class="relative mt-2 flex flex-col items-center">
          <div class="w-32 h-32 rounded-full p-1.5 bg-gradient-to-br from-gold-300 via-gold-400 to-gold-600 shadow-2xl relative">
            <div class="w-full h-full rounded-full bg-white flex items-center justify-center overflow-hidden border-4 border-white" id="profileAvatarWrap">
              <span class="font-display text-5xl font-bold text-violet-600" id="profileAvatarLetter">A</span>
            </div>
            <div class="avatar-edit-btn" onclick="document.getElementById('avatarFileInput').click()"><i class="fa-solid fa-camera" aria-hidden="true"></i></div>
          </div>
          <h2 class="font-display text-2xl font-bold mt-4" style="color:var(--text-primary)" id="profileName">Guest</h2>
          <p class="text-sm" style="color:var(--text-secondary)" id="profileEmail"></p>
          <span id="profileTierBadge" class="hidden mt-3 px-4 py-1.5 bg-gold-400/15 border border-gold-400/40 rounded-full text-gold-600 text-xs font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-crown" aria-hidden="true"></i> <span id="profileTierText" data-i18n="sharmawyLevel1">Sharmawy Level 1</span>
          </span>
          <div id="sharmawyBenefitsCard" class="hidden mt-4 card rounded-2xl p-4 w-80 max-w-full"></div>
        </div>
        <div class="px-5 mt-8">
          <div id="profileStatsGrid" class="grid grid-cols-3 gap-3">
            <div class="card rounded-2xl p-4 text-center"><p class="text-2xl font-bold text-violet-600 font-display" id="statBookings">0</p><p class="text-[10px] mt-1" style="color:var(--text-secondary)" data-i18n="bookingsStat">Bookings</p></div>
            <div id="statFavoritesCard" class="card rounded-2xl p-4 text-center"><p class="text-2xl font-bold text-violet-600 font-display" id="statFavorites">0</p><p class="text-[10px] mt-1" style="color:var(--text-secondary)" data-i18n="favoritesStat">Favorites</p></div>
            <div class="card rounded-2xl p-4 text-center"><p class="text-2xl font-bold text-violet-600 font-display" id="statReviews">0</p><p class="text-[10px] mt-1" style="color:var(--text-secondary)" data-i18n="reviewsStat">Reviews</p></div>
          </div>
        </div>
        <div class="px-5 mt-6 space-y-3">
          <div class="card rounded-2xl p-4 flex items-center gap-4 cursor-pointer" onclick="nav.go('bookings')">
            <div class="w-12 h-12 bg-violet-50 rounded-2xl flex items-center justify-center text-violet-600"><i class="fa-solid fa-ticket" aria-hidden="true"></i></div>
            <span class="flex-1 font-medium" style="color:var(--text-primary)" data-i18n="myBookings">My Bookings</span><i class="fa-solid fa-chevron-left text-gray-300 text-xs" aria-hidden="true"></i>
          </div>
          <div class="card rounded-2xl p-4 flex items-center gap-4 cursor-pointer" onclick="nav.go('settings')">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-gray-500" style="background:var(--bg-field)"><i class="fa-solid fa-gear" aria-hidden="true"></i></div>
            <span class="flex-1 font-medium" style="color:var(--text-primary)" data-i18n="settingsTitle">Settings</span><i class="fa-solid fa-chevron-left text-gray-300 text-xs" aria-hidden="true"></i>
          </div>
          <button onclick="auth.logout()" class="w-full card rounded-2xl p-4 flex items-center gap-4 text-red-500 mt-6">
            <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i></div>
            <span class="flex-1 font-medium text-right" data-i18n="logout">Logout</span>
          </button>
        </div>
        <div class="text-center mt-8 pt-6 border-t" style="border-color:var(--border-card)">
          <p class="font-display text-sm text-violet-500 italic" data-i18n="discoverSharm2">Discover Sharm</p>
          <p class="text-[11px] text-gray-400 mt-1" data-i18n="luxuryTravelEst2024">Luxury travel, since 2024</p>
        </div>
      </div>
    </div>
