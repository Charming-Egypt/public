    <div id="contactPage" class="page">
      <div class="min-h-screen">
        <div class="listing-hero hidden lg:block">
          <div class="listing-hero-inner">
            <p class="listing-eyebrow" data-i18n="getInTouch2">— GET IN TOUCH</p>
            <h1 class="listing-title" data-i18n="contactUs">Contact Us</h1>
            <p class="listing-count" data-i18n="questionsAboutABookingOrJust">Questions about a booking, or just want to say hi?</p>
          </div>
        </div>
        <div class="px-5 pt-6 pb-4 header-light lg:hidden">
          <div class="flex items-center gap-3">
            <button type="button" aria-label="Back" data-i18n-aria="ariaBack" data-back onclick="nav.goBack()" class="w-11 h-11 field-box rounded-xl flex items-center justify-center" style="color:var(--text-primary)"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            <div><p class="section-subtitle" data-i18n="getInTouch2">— GET IN TOUCH</p><h1 class="text-lg font-bold font-display" style="color:var(--text-primary)" data-i18n="contactUs">Contact Us</h1></div>
          </div>
        </div>
        <div class="px-5 py-6 pb-28 contact-layout">
          <div class="contact-info-col">
            <a href="mailto:hello@discover-sharm.com" class="contact-info-card" data-i18n="emailhelloDiscoverSharmCom"><i class="fa-regular fa-envelope" aria-hidden="true"></i><div><p class="contact-info-label">Email</p><p class="contact-info-value">hello@discover-sharm.com</p></div></a>
            <a href="#" class="contact-info-card" data-i18n="whatsappchatWithOurTeam"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i><div><p class="contact-info-label">WhatsApp</p><p class="contact-info-value">Chat with our team</p></div></a>
            <div class="contact-info-card"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><div><p class="contact-info-label" data-i18n="location">Location</p><p class="contact-info-value" data-i18n="sharmElSheikhSouthSinaiEgypt2">Sharm El-Sheikh, South Sinai, Egypt</p></div></div>
          </div>
          <form class="contact-form-col" onsubmit="submitContactForm(event)">
            <input type="text" id="contactName" required placeholder="Your name" data-i18n-placeholder="phYourName" class="input-field w-full px-3 py-2.5 text-sm">
            <input type="email" id="contactEmail" required placeholder="Your email" data-i18n-placeholder="phYourEmail" class="input-field w-full px-3 py-2.5 text-sm">
            <textarea id="contactMessage" required rows="5" placeholder="How can we help?" data-i18n-placeholder="phHowCanWeHelp" class="input-field w-full px-3 py-2.5 text-sm"></textarea>
            <button type="submit" class="btn-gold w-full py-3.5 rounded-2xl font-bold text-ink-900" data-i18n="sendMessage">Send Message</button>
          </form>
        </div>
      </div>
    </div>
