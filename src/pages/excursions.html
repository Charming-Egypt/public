    <div id="excursionsPage" class="page">
      <div class="min-h-screen">
        <!-- Desktop listing header -->
        <div class="listing-hero hidden lg:block">
          <div class="listing-hero-inner">
            <p class="listing-eyebrow" data-i18n="activitiesEyebrow">— ACTIVITIES</p>
            <h1 class="listing-title" data-i18n="excursionsTitle">Excursions</h1>
            <p class="listing-count"><span id="excursionsCount">0</span> experiences in Sharm El-Sheikh</p>
          </div>
        </div>
        <div class="px-5 pt-6 pb-4 header-light">
          <div class="flex items-center justify-between mb-5 lg:hidden">
            <button type="button" aria-label="Back" data-i18n-aria="ariaBack" data-back onclick="nav.goBack()" class="w-11 h-11 field-box rounded-xl flex items-center justify-center" style="color:var(--text-primary)"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            <div class="text-center"><p class="section-subtitle" data-i18n="activitiesEyebrow">— ACTIVITIES</p><h1 class="text-lg font-bold font-display" style="color:var(--text-primary)" data-i18n="excursionsTitle">Excursions</h1></div>
            <div class="w-11"></div>
          </div>
          <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2" aria-hidden="true" style="inset-inline-start:14px; color:var(--text-secondary)"></i>
            <input id="excursionSearchInput" type="text" oninput="excursionsUi.onSearchInput(this.value)" data-i18n-placeholder="searchExcursions" placeholder="Search Excursions" class="w-full field-box rounded-xl text-sm py-3" style="padding-inline-start:40px; padding-inline-end:12px; color:var(--text-primary)">
          </div>
          <div class="horizontal-scroll !px-0 listing-filter-row">
            <button onclick="search.filterExcursionCategory('all')" data-cat="all" class="filter-chip excursion-chip active flex-shrink-0 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> <span data-i18n="all">All</span></button>
            <button onclick="search.filterExcursionCategory('diving')" data-cat="diving" class="filter-chip excursion-chip flex-shrink-0 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2"><i class="fa-solid fa-person-swimming" aria-hidden="true"></i> <span data-i18n="catDiving">Diving</span></button>
            <button onclick="search.filterExcursionCategory('desert')" data-cat="desert" class="filter-chip excursion-chip flex-shrink-0 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2"><i class="fa-solid fa-person-hiking" aria-hidden="true"></i> <span data-i18n="catDesert">Desert Safari</span></button>
            <button onclick="search.filterExcursionCategory('boat')" data-cat="boat" class="filter-chip excursion-chip flex-shrink-0 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2"><i class="fa-solid fa-sailboat" aria-hidden="true"></i> <span data-i18n="catBoat">Boat Trip</span></button>
            <button onclick="search.filterExcursionCategory('city')" data-cat="city" class="filter-chip excursion-chip flex-shrink-0 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2"><i class="fa-solid fa-city" aria-hidden="true"></i> <span data-i18n="catCity">City Tour</span></button>
          </div>
          <div class="flex items-center gap-2 mt-3 flex-wrap">
            <select id="excursionSortSelect" onchange="excursionsUi.onSortChange(this.value)" class="field-box rounded-xl text-xs py-2 px-3" style="color:var(--text-primary)">
              <option value="popular" data-i18n="sortPopular">Popular</option>
              <option value="priceLow" data-i18n="sortPriceLowHigh">Price: Low to High</option>
              <option value="priceHigh" data-i18n="sortPriceHighLow">Price: High to Low</option>
              <option value="rating" data-i18n="sortTopRated">Top Rated</option>
            </select>
            <input id="excursionMinPriceInput" type="number" min="0" oninput="excursionsUi.onPriceChange(this.value, document.getElementById('excursionMaxPriceInput').value)" data-i18n-placeholder="minPriceLabel" placeholder="Min Price" class="field-box rounded-xl text-xs py-2 px-3 w-24" style="color:var(--text-primary)">
            <input id="excursionMaxPriceInput" type="number" min="0" oninput="excursionsUi.onPriceChange(document.getElementById('excursionMinPriceInput').value, this.value)" data-i18n-placeholder="maxPriceLabel" placeholder="Max Price" class="field-box rounded-xl text-xs py-2 px-3 w-24" style="color:var(--text-primary)">
            <select id="excursionMinRatingSelect" onchange="excursionsUi.onMinRatingChange(this.value)" class="field-box rounded-xl text-xs py-2 px-3" style="color:var(--text-primary)">
              <option value="0" data-i18n="anyRatingLabel">Any</option>
              <option value="4">4.0+ ★</option>
              <option value="4.5">4.5+ ★</option>
            </select>
            <button onclick="excursionsUi.clearFilters()" class="text-xs font-semibold px-3 py-2 rounded-xl" style="color:var(--brand-violet)"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> <span data-i18n="clearFiltersBtn">Clear Filters</span></button>
          </div>
        </div>
        <div class="px-5 pt-4 space-y-4 pb-28" id="excursionsList"></div>
      </div>
    </div>
