    <div id="transfersPage" class="page">
      <div class="min-h-screen">
        <div class="listing-hero hidden lg:block">
          <div class="listing-hero-inner">
            <p class="listing-eyebrow" data-i18n="rideEyebrow">— GROUND TRANSPORT</p>
            <h1 class="listing-title" data-i18n="transfersTitle">Airport Transfers</h1>
            <p class="listing-count" data-i18n="transfersSubtitle">Choose a vehicle for your ride between Sharm El Sheikh International Airport (SSH) and your hotel.</p>
          </div>
        </div>
        <div class="px-5 pt-6 pb-4 header-light lg:hidden">
          <div class="flex items-center gap-3 mb-2">
            <button type="button" aria-label="Back" data-i18n-aria="ariaBack" data-back onclick="nav.goBack()" class="w-11 h-11 field-box rounded-xl flex items-center justify-center" style="color:var(--text-primary)"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            <div><p class="section-subtitle" data-i18n="rideEyebrow">— GROUND TRANSPORT</p><h1 class="text-lg font-bold font-display" style="color:var(--text-primary)" data-i18n="transfersTitle">Airport Transfers</h1></div>
          </div>
          <p class="text-xs leading-relaxed mt-2" style="color:var(--text-secondary)" data-i18n="transfersSubtitle">Choose a vehicle for your ride between Sharm El Sheikh International Airport (SSH) and your hotel.</p>
        </div>
        <div class="px-5 pt-2 pb-2">
          <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2" aria-hidden="true" style="inset-inline-start:14px; color:var(--text-secondary)"></i>
            <input id="transferSearchInput" type="text" oninput="transfersUi.onSearchInput(this.value)" data-i18n-placeholder="searchTransfersPlaceholder" placeholder="Search transfers..." class="w-full field-box rounded-xl text-sm py-3" style="padding-inline-start:40px; padding-inline-end:12px; color:var(--text-primary)">
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <select id="transferSortSelect" onchange="transfersUi.onSortChange(this.value)" class="field-box rounded-xl text-xs py-2 px-3" style="color:var(--text-primary)">
              <option value="popular" data-i18n="sortPopular">Popular</option>
              <option value="priceLow" data-i18n="sortPriceLowHigh">Price: Low to High</option>
              <option value="priceHigh" data-i18n="sortPriceHighLow">Price: High to Low</option>
              <option value="capacity" data-i18n="sortCapacity">Most Passengers</option>
            </select>
            <input id="transferMinPriceInput" type="number" min="0" oninput="transfersUi.onPriceChange(this.value, document.getElementById('transferMaxPriceInput').value)" data-i18n-placeholder="minPriceLabel" placeholder="Min Price" class="field-box rounded-xl text-xs py-2 px-3 w-24" style="color:var(--text-primary)">
            <input id="transferMaxPriceInput" type="number" min="0" oninput="transfersUi.onPriceChange(document.getElementById('transferMinPriceInput').value, this.value)" data-i18n-placeholder="maxPriceLabel" placeholder="Max Price" class="field-box rounded-xl text-xs py-2 px-3 w-24" style="color:var(--text-primary)">
            <select id="transferMinCapacitySelect" onchange="transfersUi.onMinCapacityChange(this.value)" class="field-box rounded-xl text-xs py-2 px-3" style="color:var(--text-primary)">
              <option value="0" data-i18n="anyRatingLabel">Any</option>
              <option value="2">2+</option>
              <option value="4">4+</option>
              <option value="7">7+</option>
              <option value="10">10+</option>
            </select>
            <button onclick="transfersUi.clearFilters()" class="text-xs font-semibold px-3 py-2 rounded-xl" style="color:var(--brand-violet)"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> <span data-i18n="clearFiltersBtn">Clear Filters</span></button>
          </div>
        </div>
        <div class="px-5 pt-4 space-y-4 pb-28" id="transfersList"></div>
      </div>
    </div>
