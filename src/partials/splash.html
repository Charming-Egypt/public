<div id="splashPage" role="presentation" aria-hidden="true" style="--sp-logo-url:url('/icons/splash-logo.png?v={{ICON_V}}')">
    <!-- In-app splash: lives in the HTML shell so it paints instantly. Themed: follows <html data-theme> (set in <head> before first paint).
         Layout (matches the iOS launch image from tools/make-pwa-assets.py): the Discover Sharm logo centred a touch above the middle,
         "From MG - Tours" near the bottom. The logo has an animated entrance: sun-glow burst → logo pops in (scale + de-blur, small overshoot)
         → a light glint sweeps across it (masked by the logo's own alpha) → gentle float; sparkles twinkle around it; the credit rises in last.
         Self-contained on purpose (own variables) — it must not depend on site-app.css having been parsed.
         {{SPLASH_BG}} is only the fallback colour (= manifest background_color, see SPLASH_BG in tools/build.mjs).
         Min display time is set below (window.__dsSplashUntil) and honoured by hideSplash() in data.js. -->
    <style>
      #splashPage { --sp-bg: #0d0d0f;
        position: fixed; inset: 0; z-index: 999; overflow: hidden; background: var(--sp-bg, {{SPLASH_BG}}); opacity: 1; transition: opacity .5s ease; }
      :root[data-theme="light"] #splashPage { --sp-bg: #f6f5f3; }
      #splashPage * { box-sizing: border-box; }

      #splashPage .sp-glow { position: absolute; left: 50%; top: 45%; width: 130vmin; height: 130vmin; margin: -65vmin 0 0 -65vmin; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(251,146,60,.42) 0%, rgba(249,115,22,.14) 38%, transparent 66%);
        animation: spBurst 1.1s cubic-bezier(.2,.8,.2,1) both, spGlow 3.6s ease-in-out 1.1s infinite; }
      #splashPage .sp-ring { position: absolute; left: 50%; top: 45%; width: 40vmin; height: 40vmin; margin: -20vmin 0 0 -20vmin; border-radius: 50%; pointer-events: none;
        border: 2px solid rgba(251,146,60,.55); opacity: 0; animation: spRing 1.4s ease-out .35s both; }

      /* logo: width ~ 74% of a phone screen, capped so tablets/desktops don't blow it up */
      #splashPage .sp-logo { --lw: min(74vw, 26rem); position: absolute; left: 50%; top: 45%; width: var(--lw); aspect-ratio: 1546 / 1194; translate: -50% -50%;
        animation: spPop 1.15s cubic-bezier(.2,.9,.25,1.15) .15s both, spFloat 5s ease-in-out 1.4s infinite; }
      #splashPage .sp-logo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 28px rgba(249,115,22,.35)); }
      #splashPage .sp-shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
        -webkit-mask: var(--sp-logo-url) center / 100% 100% no-repeat; mask: var(--sp-logo-url) center / 100% 100% no-repeat;
        background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) 150% 0 / 260% 100% no-repeat; animation: spShine 2.8s ease-in-out 1.2s infinite; }
      #splashPage .sp-star { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; background: #fff; opacity: 0; filter: drop-shadow(0 0 6px rgba(255,255,255,.9));
        clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: spTwinkle 2.6s ease-in-out infinite; }
      #splashPage .sp-star:nth-of-type(1) { left: 14%; top: 24%; animation-delay: 1.1s; }
      #splashPage .sp-star:nth-of-type(2) { left: 88%; top: 18%; animation-delay: 1.6s; width: 16px; height: 16px; margin: -8px 0 0 -8px; }
      #splashPage .sp-star:nth-of-type(3) { left: 80%; top: 92%; animation-delay: 2.1s; width: 14px; height: 14px; margin: -7px 0 0 -7px; }

      /* credit */
      #splashPage .sp-from { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh); translate: -50% 0; width: min(46vw, 15rem); height: auto; display: block;
        animation: spRise .8s ease 1.1s both; }
      /* loader */
      #splashPage .sp-dots { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); display: flex; gap: 8px; padding: 9px 14px; border-radius: 99px; background: rgba(120,120,120,.22); animation: spRise .6s ease 1.3s both; }
      #splashPage .sp-dots i { width: 8px; height: 8px; border-radius: 50%; background: #f97316; animation: spDot 1.1s ease-in-out infinite; }
      #splashPage .sp-dots i:nth-child(2) { animation-delay: .15s; }
      #splashPage .sp-dots i:nth-child(3) { animation-delay: .3s; }

      @keyframes spBurst { from { transform: scale(.2); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: .9; } }
      @keyframes spRing { from { transform: scale(.4); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
      @keyframes spPop { 0% { transform: scale(.45) rotate(-6deg); opacity: 0; filter: blur(14px); } 55% { opacity: 1; filter: blur(0); } 100% { transform: none; opacity: 1; filter: blur(0); } }
      @keyframes spFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-7px) scale(1.015); } }
      @keyframes spShine { 0% { background-position: 150% 0; } 55%,100% { background-position: -60% 0; } }
      @keyframes spTwinkle { 0%,100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: 0; transform: scale(.4) rotate(90deg); } }
      @keyframes spGlow { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.1); opacity: 1; } }
      @keyframes spRise { from { transform: translate(0, 12px); opacity: 0; } to { transform: none; opacity: 1; } }
      #splashPage .sp-dots { animation-name: spRiseC; }
      @keyframes spRiseC { from { transform: translate(-50%, 10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
      @keyframes spDot { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splashPage * { animation: none !important; } #splashPage .sp-shine, #splashPage .sp-star, #splashPage .sp-ring { display: none; } }
    </style>

    <div class="sp-glow"></div>
    <div class="sp-ring"></div>
    <div class="sp-logo">
      <img src="/icons/splash-logo.png?v={{ICON_V}}" width="1546" height="1194" alt="" decoding="async" fetchpriority="high" />
      <div class="sp-shine"></div>
    </div>
    <i class="sp-star"></i><i class="sp-star"></i><i class="sp-star"></i>
    <img class="sp-from" src="/icons/from-mg.png?v={{ICON_V}}" width="420" height="264" alt="" decoding="async" />
    <div class="sp-dots"><i></i><i></i><i></i></div>

    <script>
      (function () {
        var MIN = 2800, HARD = 4500, t0 = Date.now(), done = false;
        window.__dsSplashUntil = t0 + MIN;               // hideSplash() (data.js) waits for this, so the intro is always seen
        function hide() {
          if (done) return; done = true;
          var s = document.getElementById('splashPage');
          if (!s) return;
          s.style.pointerEvents = 'none';
          s.style.opacity = '0';                         // 0.5s fade (transition declared in the style block above)
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
        }
        function afterLoad() { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0))); }
        if (document.readyState === 'complete') afterLoad();
        else window.addEventListener('load', afterLoad);
        setTimeout(hide, HARD);                          // fallback: never block on a slow asset
      })();
    </script>
  </div>
