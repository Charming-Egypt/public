<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Voucher — Discover Sharm</title>
<style>
  :root { --ink:#111; --muted:#666; --line:#e5e5e5; --brand:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f4f5; color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
  .bar { display:flex; gap:10px; justify-content:center; padding:14px; }
  button,a.btn { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px 22px; font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; }
  a.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .sheet { max-width:760px; margin:0 auto 40px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--brand); padding-bottom:16px; margin-bottom:20px; gap:16px; }
  h1 { margin:0; font-size:22px; color:var(--brand); } .ref { font:700 20px/1.2 ui-monospace,Menlo,Consolas,monospace; letter-spacing:1px; text-align:end; }
  .badge { display:inline-block; padding:3px 12px; border-radius:99px; font-size:12px; font-weight:700; background:#dcfce7; color:#166534; }
  .badge.off { background:#fee2e2; color:#991b1b; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 0 6px; }
  .row { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--line); } .row b { text-align:end; }
  .total { font-size:18px; } .note { margin-top:26px; color:var(--muted); font-size:12.5px; }
  #state { text-align:center; padding:60px 20px; color:var(--muted); }
  @media print { body { background:#fff; } .bar { display:none; } .sheet { border:0; padding:0; margin:0; max-width:none; } }
</style>
</head>
<body>
<div class="bar"><button id="print" hidden>Print / Save as PDF · طباعة / حفظ PDF</button><a class="btn ghost" href="/bookings/">My bookings · حجوزاتي</a></div>
<div id="state">Loading… · جارٍ التحميل</div>
<div class="sheet" id="sheet" hidden></div>
<script>window.DS_SUPABASE = {{SUPABASE_CONFIG}};</script>
<script src="{{SUPABASE_JS}}"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), state = $('#state');
  const say = (t) => { state.hidden = false; state.textContent = t; $('#sheet').hidden = true; };
  const cfg = window.DS_SUPABASE, id = new URLSearchParams(location.search).get('id');
  if (!cfg || !window.supabase || !id) return say('Voucher not available · الفاوتشر غير متاح');
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'ds_sb_session' } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { say('Please sign in on the site first, then open this link again. · سجّل دخول من الموقع الأول وبعدين افتح اللينك تاني.'); const a = document.createElement('a'); a.className = 'btn'; a.href = '/'; a.textContent = 'Sign in · تسجيل الدخول'; a.style.display = 'inline-block'; a.style.marginTop = '16px'; state.append(document.createElement('br'), a); return; }
  const { data, error } = await sb.rpc('list_my_bookings', { p_limit: 500 });
  const b = !error && (data || []).find((x) => x.id === id);
  if (!b || b.status !== 'completed') return say('Voucher not found · الفاوتشر غير موجود');

  const nm = (v) => (v && typeof v === 'object') ? (v.en || v.ar || Object.values(v)[0] || '') : (v || '');
  const money = (n) => `${Number(n).toLocaleString('en')} ${b.currency || 'EGP'}`;
  const rows = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== '' && v !== 0) rows.push([k, String(v)]); };
  const sheet = $('#sheet'); sheet.innerHTML = '';
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
  const head = el('div', 'head'); const l = el('div'); l.append(el('h1', '', 'Booking Voucher · فاوتشر الحجز'), el('div', '', 'Discover Sharm')); const r = el('div', 'ref', b.id); const bd = el('div'); bd.append(el('span', 'badge', 'CONFIRMED · مؤكد')); r.append(document.createElement('br'), bd); head.append(l, r); sheet.append(head);
  const section = (title, list) => { const items = list.filter(([, v]) => v !== undefined && v !== null && v !== '' && v !== 0); if (!items.length) return; sheet.append(el('h2', '', title)); items.forEach(([k, v]) => { const row = el('div', 'row'); row.append(el('span', '', k), el('b', '', v)); sheet.append(row); }); };
  const isHotel = b.type === 'hotel';
  section('Service · الخدمة', [
    ['Service · الخدمة', nm(b.hotelName || b.title || b.vehicleType)],
    ['Room · الغرفة', nm(b.roomType)],
    isHotel ? ['Check-in · الوصول', b.checkin] : ['Date · التاريخ', b.date],
    isHotel ? ['Check-out · المغادرة', b.checkout] : ['Time · الوقت', b.time],
    isHotel ? ['Nights · الليالي', b.nights] : ['', ''],
    ['Guests · الأفراد', isHotel ? `${b.adults || 0} adults${b.children ? `, ${b.children} children` : ''} · ${b.rooms || 1} room(s)` : (b.participants || b.passengers)],
    ['Pick-up · نقطة الانطلاق', nm(b.pickup)], ['Drop-off · الوجهة', nm(b.dropoff)], ['Flight · الرحلة', b.flightNumber],
  ]);
  section('Guest · الضيف', [['Name · الاسم', b.name], ['Phone · الهاتف', b.phone], ['E-mail · الإيميل', b.email]]);
  const due = b.balanceStatus === 'due' ? Number(b.balanceAmount || b.remainingAmount) : 0;
  section('Payment · الدفع', [['Total · الإجمالي', money(b.total)], ['Paid online · المدفوع', money(b.paidAmount != null ? b.paidAmount : b.total)], due ? ['Pay at the service · المتبقي', money(due)] : ['', '']]);
  sheet.append(el('p', 'note', 'Please present this voucher (printed or on your phone) at the start of the service. Changes and cancellations follow our cancellation policy. · من فضلك اعرض الفاوتشر (مطبوع أو على الموبايل) عند بداية الخدمة. التعديل والإلغاء حسب سياسة الإلغاء.'));
  state.hidden = true; sheet.hidden = false; $('#print').hidden = false; $('#print').onclick = () => window.print();
  document.title = `Voucher ${b.id} — Discover Sharm`;
  if (new URLSearchParams(location.search).get('print') === '1') setTimeout(() => window.print(), 400);
})();
</script>
</body>
</html>
