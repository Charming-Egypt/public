<div id="splashPage" class="fixed inset-0 z-[999] flex flex-col items-center justify-between" style="background:{{SPLASH_BG}};">
    <!-- same colour as the PWA's manifest background_color (SPLASH_BG in tools/build.mjs). No photo: only the logo is at full strength, everything else is faded. -->
    <div class="relative z-10 flex-1 flex flex-col items-center justify-center text-center px-8">
      <img src="/icons/splash-logo.png?v={{ICON_V}}" onerror="this.onerror=null;this.src=FALLBACK_LOGO;" class="splash-logo mb-5" width="480" height="483" alt="Discover Sharm" />

      <p class="splash-faded text-white text-sm mt-1.5" data-i18n="yourPersonalGuideLabel">Your Personal Guide</p>
    </div>
    <div class="splash-faded relative z-10 w-full px-10 pb-10">
      <div class="splash-progress-track">
        <div class="splash-progress-fill"></div>
      </div>
      <p class="text-white text-xs text-center mt-3" data-i18n="loadingYourJourneyLabel">Loading your journey…</p>
    </div>
  </div>
