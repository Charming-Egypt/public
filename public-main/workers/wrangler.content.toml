# Discover Sharm — content Worker (reads/writes the PRIVATE GitHub data repo; see content-worker.js)
#   cd workers
#   npx wrangler secret put GITHUB_TOKEN               -c wrangler.content.toml   # fine-grained token: ONLY the data repo, permission "Contents: Read and write"
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY  -c wrangler.content.toml
#   npx wrangler deploy -c wrangler.content.toml
# Custom domain (recommended): Cloudflare → Workers & Pages → discover-sharm-content → Settings → Domains & Routes → content.discover-sharm.com
#   → then set DS_CONTENT_BASE = https://content.discover-sharm.com on the www, app and admin Pages projects.
name = "discover-sharm-content"
main = "content-worker.js"
compatibility_date = "2026-01-01"
keep_vars = true   # variables live in the Cloudflare dashboard (Settings → Variables and Secrets); see VARIABLES.md

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR-ANON-KEY"
GITHUB_REPO = "YOUR-ORG/discover-sharm-data"     # the private data repo (owner/name)
GITHUB_BRANCH = "main"
ALLOWED_ORIGINS = "https://www.discover-sharm.com,https://app.discover-sharm.com,https://admin.discover-sharm.com"
